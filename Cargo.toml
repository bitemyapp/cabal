[package]
name = "cabal"
version = "0.1.0"
edition = "2024"

[dependencies]
cinch-rs = { path = "cinch-rs/crates/cinch-rs" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
futures = "0.3"
toml = "0.8"
dirs = "6"
